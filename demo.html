.brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;flex:none}
.nav button,.icon-btn{background:none;border:0;color:var(--muted);font:inherit;font-size:.92rem;padding:8px 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nav button:hover,.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{color:var(--text);background:var(--surface-2);font-weight:600}
.icon-btn svg,.nav svg{width:18px;height:18px}
main{padding:20px 16px 64px;outline:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stack>*+*{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:.95rem;font-weight:560;padding:9px 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;line-height:1.2;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem;min-height:32px;border-radius:8px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spacer{flex:1}
.eyebrow{text-transform:uppercase;letter-spacing:.06em;font-size:.74rem;color:var(--muted);margin:0 0 4px;font-weight:600}
.hero-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--c-new);margin:14px 0 8px}
.sbar i{display:block;height:100%}
.st-mastered{background:var(--c-mastered)}.st-learning{background:var(--c-learning)}.st-missed{background:var(--c-missed)}.st-new{background:var(--c-new)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ch-head{display:flex;align-items:flex-start;gap:8px}
.ch-head h3{flex:1;margin:4px 0 0}
.section-title{display:flex;align-items:center;gap:8px;margin:28px 0 12px}
.section-title h2{margin:0;flex:1}
.star-btn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex;flex:none}
.star-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.share-deck{margin-top:8px}
.copy-ai{background:none;border:0;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:5px;flex:none;font:inherit;font-size:.82rem;font-weight:600}
